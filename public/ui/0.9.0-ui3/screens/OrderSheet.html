<style>
/* KMS shared style (UI pass part 1, docs/UI_PASS_PLAN.md sections 2 and 3;
   which block to use when: docs/STYLE_GUIDE.md). Forest Garden.
   Every screen gets the named colours below and the shared notices and
   question box. Only a converted screen (<html class="kms-styled">) gets the
   whole-page rules and dark mode; any other screen is held in light mode.
   Screens never set colours or text sizes of their own. */
:root {
  /* Named colours, light (the contrast test reads these two lists). */
  --kms-page: #ECF0E2;
  --kms-panel: #FDFEF9;
  --kms-title-row: #DFE7CF;
  --kms-ink: #2E3C3A;
  --kms-muted: #55625E;
  --kms-line: #D6DEC7;
  --kms-control-line: #768471;
  --kms-primary: #9CCB8C;
  --kms-on-primary: #16301B;
  --kms-focus: #3F7A3A;
  --kms-editing: #E3EFCF;
  --kms-on-editing: #2E3C3A;
  --kms-editing-control: #FDFEF9;
  --kms-editing-muted: #4C5955;
  --kms-accent: #6FA85A;
  --kms-done: #3F6E2A;
  --kms-done-bg: #E4EFD6;
  --kms-check: #6E5600;
  --kms-check-bg: #FAF1BE;
  --kms-stop: #A8481F;
  --kms-stop-bg: #F8E4D6;
  --kms-danger: #2E3C3A;
  --kms-allergen: #2E3C3A;
  --kms-on-allergen: #FDFEF9;
  --kms-paused: #2F6A84;
  --kms-paused-bg: #DCEBEE;
  --kms-backdrop: rgba(35, 42, 46, .55);
  --kms-shadow: 0 1px 2px rgba(34, 52, 58, .08), 0 8px 24px rgba(34, 52, 58, .07);
  /* Text, sizes and corners. */
  --kms-font: "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --kms-font-title: "Fraunces", Georgia, "Iowan Old Style", serif;
  --kms-text: 16px; --kms-small: 14px; --kms-title: 30px; --kms-section: 21px;
  --kms-control: 44px; --kms-pad: 22px; --kms-gap: 18px; --kms-row: 46px;
  --kms-radius: 12px; --kms-radius-panel: 16px;
  color-scheme: light;
}
html.kms-styled[data-kms-theme="dark"] {
  /* Named colours, dark. */
  --kms-page: #232A2E;
  --kms-panel: #2D353B;
  --kms-title-row: #252B2F;
  --kms-ink: #D3C6AA;
  --kms-muted: #9DA9A0;
  --kms-line: #475258;
  --kms-control-line: #859289;
  --kms-primary: #8CC49C;
  --kms-on-primary: #2D353B;
  --kms-focus: #DBBC7F;
  --kms-editing: #8CC49C;
  --kms-on-editing: #1F2A24;
  --kms-editing-control: #EEF5E8;
  --kms-editing-muted: #2F3F36;
  --kms-accent: #8CC49C;
  --kms-done: #8CC49C;
  --kms-done-bg: #36443A;
  --kms-check: #E6CF6E;
  --kms-check-bg: #3B3A2A;
  --kms-stop: #EC7E5F;
  --kms-stop-bg: #3B2D29;
  --kms-danger: #D3C6AA;
  --kms-allergen: #D3C6AA;
  --kms-on-allergen: #2D353B;
  --kms-paused: #7FBBB3;
  --kms-paused-bg: #2F3E44;
  --kms-backdrop: rgba(0, 0, 0, .6);
  --kms-shadow: none;
  color-scheme: dark;
}
/* The row being edited: on its green, ink, outlines and marks use the row's own
   text colour, never the page's (Astra, 19:41). Its fields and buttons get a
   light surface of their own, and disabled ones the row's green, so they never
   keep the dark page's surfaces under the row's dark text (Astra, U1 review). */
.kms-editing {
  --kms-ink: var(--kms-on-editing); --kms-muted: var(--kms-editing-muted); --kms-danger: var(--kms-on-editing);
  --kms-panel: var(--kms-editing-control); --kms-title-row: var(--kms-editing);
  --kms-allergen: var(--kms-on-editing); --kms-on-allergen: var(--kms-editing); --kms-control-line: var(--kms-on-editing);
  --kms-focus: var(--kms-on-editing);
}
/* The sample's #6E4600 was 4.13:1 on the dark green row; #5E3C00 is 4.94:1 (U1 contrast test). */

html.kms-styled { background: var(--kms-page); }
html.kms-styled body { margin: 0; background: var(--kms-page); color: var(--kms-ink); font: var(--kms-text)/1.45 var(--kms-font); }
html.kms-styled *, html.kms-styled *::before, html.kms-styled *::after { box-sizing: border-box; }
html.kms-styled :focus-visible { outline: 3px solid var(--kms-focus); outline-offset: 2px; }
html.kms-styled h1 { margin: 0; font: 600 var(--kms-title)/1.15 var(--kms-font-title); }
html.kms-styled h2 { margin: 0 0 calc(var(--kms-gap) * .8); font: 600 var(--kms-section)/1.2 var(--kms-font-title); }
html.kms-styled h3 { margin: 0 0 8px; font-size: var(--kms-text); font-weight: 700; }
html.kms-styled a { color: inherit; text-decoration-thickness: 2px; text-underline-offset: 3px; }
html.kms-styled .kms-muted { color: var(--kms-muted); }
html.kms-styled small, html.kms-styled .kms-small { font-size: var(--kms-small); }

/* Page header card with the short accent line under the title. */
html.kms-styled .kms-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px;
  margin-bottom: 4px; padding: calc(var(--kms-pad) * .7) var(--kms-pad); background: var(--kms-panel); color: var(--kms-ink);
  border-radius: var(--kms-radius-panel); box-shadow: var(--kms-shadow); }
html.kms-styled[data-kms-theme="dark"] .kms-header { border: 1px solid var(--kms-line); }
html.kms-styled .kms-header h1::after { content: ""; display: block; width: 40px; height: 4px; margin-top: 8px; border-radius: 4px; background: var(--kms-accent); }
html.kms-styled .kms-header .kms-who { font-size: var(--kms-small); color: var(--kms-muted); }

/* Panels, with a small leaf mark before the title. */
html.kms-styled .kms-panel { background: var(--kms-panel); border: 1px solid var(--kms-line); border-radius: var(--kms-radius-panel); padding: var(--kms-pad); }
html.kms-styled .kms-panel + .kms-panel { margin-top: var(--kms-gap); }
html.kms-styled .kms-panel > h2::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 10px; border-radius: 50% 0;
  background: var(--kms-accent); vertical-align: middle; }

/* Fields: a label, the control, an optional hint; a mistake has a heavier
   border in the text colour and its wording in the stop colour. */
html.kms-styled .kms-fields { display: grid; gap: var(--kms-gap); grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
html.kms-styled label, html.kms-styled .kms-label { display: block; margin-bottom: 4px; font-size: var(--kms-small); font-weight: 700; color: var(--kms-muted); }
html.kms-styled .kms-hint { margin-top: 4px; font-size: var(--kms-small); color: var(--kms-muted); }
html.kms-styled input, html.kms-styled select, html.kms-styled textarea, html.kms-styled button { font: inherit; color: inherit; }
/* :where() keeps this rule as light as a plain "input" rule, so the disabled,

html.kms-styled input:where(:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"])),
html.kms-styled select, html.kms-styled textarea {
  width: 100%; min-height: var(--kms-control); padding: 0 12px; background: var(--kms-panel); color: var(--kms-ink);
  border: 1px solid var(--kms-control-line); border-radius: 10px; }
html.kms-styled textarea { padding: 10px 12px; line-height: 1.4; resize: vertical; }
html.kms-styled input::placeholder, html.kms-styled textarea::placeholder { color: var(--kms-muted); opacity: 1; }
html.kms-styled input:hover:not(:disabled), html.kms-styled select:hover:not(:disabled), html.kms-styled textarea:hover:not(:disabled) { border-color: var(--kms-ink); }
html.kms-styled input:focus-visible, html.kms-styled select:focus-visible, html.kms-styled textarea:focus-visible { outline-offset: 1px; border-color: var(--kms-ink); }
html.kms-styled input:disabled, html.kms-styled select:disabled, html.kms-styled textarea:disabled,
html.kms-styled input[readonly], html.kms-styled textarea[readonly] { background: var(--kms-title-row); color: var(--kms-muted); border-style: dashed; cursor: not-allowed; }
html.kms-styled input[readonly], html.kms-styled textarea[readonly] { cursor: default; }
html.kms-styled .kms-invalid input, html.kms-styled .kms-invalid select, html.kms-styled .kms-invalid textarea,
html.kms-styled [aria-invalid="true"] { border: 3px solid var(--kms-danger); }

<script>
// Shared screen patterns (UI pass part 1, plan section 3 item 2): the question
// box that replaces the browser's OK/Cancel box, the progress panel, the status
// line, waiting for the owner, and a button's "working" state. Every screen
// gets this file; its look is in KmsStyle.html.
window.KmsUi = (function() {
  'use strict';
  let open = null;
  // The shell's own window, or null in Sheets and in the shell itself.
  function shell() { try { return window.parent !== window && window.parent.KmsWeb || null; } catch (error) { return null; } }
  // Who and where the question was asked: the shell's ticket for this screen
  // (its sign-in epoch), the restaurant and person, and this screen.
  function place() {
    const web = shell();
    let ticket = null, context = null;
    try { ticket = web && web.ticket ? web.ticket(window) : null; } catch (error) {}
    try { context = web && web.context && typeof SCREEN === 'string' ? web.context(SCREEN) : window.KmsRecoveryContext || null; } catch (error) {}
    return JSON.stringify({epoch: ticket ? ticket.epoch : null, shell: !!web, live: !web || !!ticket, context: context});
  }
  function paused() { try { const m = window.KmsStatus && window.KmsStatus.maintenance(); return !!(m && (m.capturing || m.restoring)); } catch (error) { return false; } }
  // Every field on the page outside the box, so a changed form is noticed.
  function formState(box) {
    return JSON.stringify(Array.from(document.querySelectorAll('input,select,textarea')).filter(el => !box || !box.contains(el))
      .map(el => [el.id, el.name, el.type === 'file' ? el.files && el.files.length : el.value, el.type === 'checkbox' || el.type === 'radio' ? el.checked : null]));
  }
  const FOCUSABLE = 'button:not([disabled]),textarea:not([disabled]),input:not([disabled]),select:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])';

  // Asks one question in the page (plan section 3a). Resolves once with
  // {ok: true, reason} for the action button, or {ok: false, why} where why is
  // 'cancelled' (the safe button, Escape), 'busy' (another question is open),
  // 'changed' (what it was about changed before the answer) or 'closed' (the
  // screen, sign-in or restaurant changed, or KMS paused). A yes is never a
  // save; the caller acts only on ok, and only on what it asked about.
  // options: title, text, yes, no, danger, reason {label, required},
  // still() (false once the question is out of date), form (false: page
  // fields may change while it is open; default true).
  function ask(options) {
    options = options || {};
    if (open) return Promise.resolve({ok: false, why: 'busy'});
    const web = shell();
    try { if (web && web.questionOpen && web.questionOpen()) return Promise.resolve({ok: false, why: 'busy'}); } catch (error) {}
    if (paused()) return Promise.resolve({ok: false, why: 'closed'});
    return new Promise(resolve => {
      const layer = document.createElement('div'), box = document.createElement('section'), title = document.createElement('h2'), text = document.createElement('p');
      const buttons = document.createElement('div'), no = document.createElement('button'), yes = document.createElement('button');
      const id = 'kmsAsk' + Date.now().toString(36);
      layer.className = 'kms-ask-layer'; box.className = 'kms-ask';
      box.setAttribute('role', options.danger ? 'alertdialog' : 'dialog'); box.setAttribute('aria-modal', 'true');
      box.setAttribute('aria-labelledby', id + 'T'); box.setAttribute('aria-describedby', id + 'D');
      title.id = id + 'T'; title.textContent = options.title || 'Are you sure?';
      text.id = id + 'D'; text.textContent = options.text || '';
      buttons.className = 'kms-ask-buttons';
      no.type = 'button'; no.className = 'kms-ask-no'; no.textContent = options.no || 'Cancel';
      yes.type = 'button'; yes.className = 'kms-ask-yes' + (options.danger ? ' kms-danger' : ''); yes.textContent = options.yes || 'Continue';
      box.append(title, text);
      let reason = null;
      if (options.reason) {
        const label = document.createElement('label'); reason = document.createElement('textarea');
        reason.id = id + 'R'; label.htmlFor = reason.id; label.textContent = options.reason.label || 'Reason';
        reason.maxLength = options.reason.max || 500; box.append(label, reason);
        if (options.reason.required) { yes.disabled = true; reason.addEventListener('input', () => { yes.disabled = !reason.value.trim(); }); }
      }
      buttons.append(no, yes); box.append(buttons); layer.append(box);
      const before = document.activeElement, where = place(), form = options.form === false ? null : formState(null);
      const blocked = [];
      let watch = 0;
      function settle(answer) {
        if (!open || open.layer !== layer) return;
        open = null; clearInterval(watch);
        no.disabled = true; yes.disabled = true;
        window.removeEventListener('pagehide', closed);
        layer.remove();
        blocked.forEach(el => el.removeAttribute('inert'));
        try { if (web && web.screenQuestion) web.screenQuestion(false); } catch (error) {}
        if (before && before.isConnected && typeof before.focus === 'function') { try { before.focus(); } catch (error) {} }
        resolve(answer);
      }
      function current() {
        if (place() !== where || paused()) return 'closed';
        try { if (options.still && options.still() === false) return 'changed'; } catch (error) { return 'changed'; }
        if (form !== null && formState(box) !== form) return 'changed';
        return '';
      }
      function closed() { settle({ok: false, why: 'closed'}); }
      no.addEventListener('click', () => settle({ok: false, why: 'cancelled'}));
      yes.addEventListener('click', () => {
        if (!open || open.layer !== layer || yes.disabled) return;
        // Checked again at the moment of yes: anything changed means do nothing.
        const changed = current();
        if (changed) { settle({ok: false, why: changed}); return; }
        if (reason && options.reason.required && !reason.value.trim()) return;
        settle({ok: true, reason: reason ? reason.value.trim() : ''});
      });
      layer.addEventListener('keydown', event => {
        if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); settle({ok: false, why: 'cancelled'}); return; }
        if (event.key !== 'Tab') return;
        const items = Array.from(box.querySelectorAll(FOCUSABLE));
        if (!items.length) return;
        const first = items[0], last = items[items.length - 1];
        if (event.shiftKey && (document.activeElement === first || !box.contains(document.activeElement))) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && (document.activeElement === last || !box.contains(document.activeElement))) { event.preventDefault(); first.focus(); }
      });
      // The page behind cannot be used while the question is open.
      Array.from(document.body.children).forEach(el => { if (el !== layer && !el.hasAttribute('inert')) { el.setAttribute('inert', ''); blocked.push(el); } });
      open = {layer: layer, settle: settle};
      document.body.append(layer);
      try { if (web && web.screenQuestion) web.screenQuestion(true); } catch (error) {}
      window.addEventListener('pagehide', closed);
      // A pause, a sign-in or screen change, or the question going out of date
      // count as Cancel while it waits.
      watch = setInterval(() => { const changed = current(); if (changed) settle({ok: false, why: changed}); }, 400);
      (reason && !options.danger ? reason : no).focus();
    });
  }
  function cancel(why) { if (open) open.settle({ok: false, why: why || 'closed'}); }

  // Runs an action from a button once: the button says it is working and
  // cannot be pressed again until the action has finished.
  function working(button, action) {
    if (!button || button.classList.contains('kms-working')) return Promise.resolve(undefined);
    const wasDisabled = button.disabled;
    button.classList.add('kms-working'); button.setAttribute('aria-busy', 'true'); button.disabled = true;
    return Promise.resolve().then(action).finally(() => {
      button.classList.remove('kms-working'); button.removeAttribute('aria-busy'); button.disabled = wasDisabled;
    });
  }

  // Progress panel: steps [text], the current step's number, and an optional
  // fraction 0..1 for the bar.
  function progress(el, steps, now, fraction) {
    if (!el) return;
    el.classList.add('kms-progress');
    const bar = document.createElement('div'), fill = document.createElement('span'), list = document.createElement('ol');
    const done = typeof fraction === 'number' ? Math.max(0, Math.min(1, fraction)) : steps.length ? Math.min(now, steps.length) / steps.length : 0;
    bar.className = 'kms-bar'; bar.setAttribute('role', 'progressbar'); bar.setAttribute('aria-valuemin', '0'); bar.setAttribute('aria-valuemax', '100');
    bar.setAttribute('aria-valuenow', String(Math.round(done * 100))); fill.style.width = (done * 100) + '%'; bar.append(fill);
    steps.forEach((step, i) => {
      const li = document.createElement('li');
      li.className = i < now ? 'kms-done' : i === now ? 'kms-now' : '';
      li.textContent = (i < now ? '✓ ' : i === now ? '▸ ' : '') + step;
      if (i === now) li.setAttribute('aria-current', 'step');
      list.append(li);
    });
    el.replaceChildren(bar, list);
  }
  // Status line: "Draft saved at 14:32". The time is a fixed 24-hour HH:MM.
  function statusLine(el, text, at) {
    if (!el) return;
    if (!el.hasAttribute('role')) { el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite'); }
    const time = at ? ' at ' + String(new Date(at).getHours()).padStart(2, '0') + ':' + String(new Date(at).getMinutes()).padStart(2, '0') : '';
    const value = text + time + (text && !/[.!?]$/.test(text + time) ? '.' : '');
    if (el.textContent !== value) el.textContent = value;
  }
  // Waiting for the owner: says what is waiting. note: what the person may do
  // meanwhile, given only by a screen whose work really carries on without
  // them (UI pass plan 11.8); nothing is promised by default.
  function waiting(el, text, note) {
    if (!el) return;
    const spin = document.createElement('span'), p = document.createElement('p');
    el.classList.add('kms-waiting'); spin.className = 'kms-spinner'; spin.setAttribute('aria-hidden', 'true');
    p.textContent = note ? text + ' ' + note : text;
    el.replaceChildren(spin, p);
  }

  // ---------- Controls (tier 1) ----------
  // The weekday beside a date, as "Mon 26 Oct"; empty for no date.
  function weekday(value) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(value || '')) return '';
    const date = new Date(value + 'T00:00:00Z');
    if (!Number.isFinite(date.getTime()) || date.toISOString().slice(0, 10) !== value) return '';
    return date.toLocaleDateString('en-GB', {weekday: 'short', timeZone: 'UTC'});
  }
  // Screens and recovery set values by script too, which fires no event, so a
  // control that shows something about a field's value watches its setter.
  const watchers = new WeakMap();
  function watchValue(el, fn) {
    let list = watchers.get(el);
    if (!list) {
      const proto = Object.getPrototypeOf(el), own = Object.getOwnPropertyDescriptor(proto, 'value') ||
        Object.getOwnPropertyDescriptor(el instanceof HTMLSelectElement ? HTMLSelectElement.prototype : el instanceof HTMLTextAreaElement ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype, 'value');
      list = []; watchers.set(el, list);
      Object.defineProperty(el, 'value', {configurable: true, get() { return own.get.call(this); }, set(v) { own.set.call(this, v); list.slice().forEach(f => f()); }});
      ['input', 'change'].forEach(type => el.addEventListener(type, () => list.slice().forEach(f => f())));
    }
    list.push(fn);
    fn();
  }
  function dateField(input) {
    if (input.dataset.kmsWeekday) return;
    input.dataset.kmsWeekday = '1';
    const wrap = document.createElement('span'), day = document.createElement('span');
    wrap.className = 'kms-date'; day.className = 'kms-weekday'; day.setAttribute('aria-hidden', 'true');
    input.replaceWith(wrap); wrap.append(input, day);
    watchValue(input, () => { const text = weekday(input.value); if (day.textContent !== text) day.textContent = text; });
  }
  function controls(scope) {
    if (!document.documentElement.classList.contains('kms-styled')) return;
    (scope || document).querySelectorAll('input[type="date"]').forEach(dateField);
    (scope || document).querySelectorAll('input[type="number"]:not([inputmode])').forEach(input => {
      input.setAttribute('inputmode', /^(any|0?\.\d+)$/.test(input.getAttribute('step') || '') ? 'decimal' : 'numeric');
    });
    (scope || document).querySelectorAll('textarea.kms-grow').forEach(grow);
  }

  // ---------- Controls (tier 2, plan section 13) ----------
  let uid = 0;
  const nextId = prefix => prefix + (++uid).toString(36);
  // Text for comparing what was typed: no capitals or accents, so "salo" finds "Šalotai".
  const plain = text => String(text || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  // Today and other days as yyyy-mm-dd in the device's own time, as screens enter them.
  function isoDay(offsetDays, from) {
    const d = from ? new Date(from + 'T12:00:00') : new Date();
    d.setDate(d.getDate() + (offsetDays || 0));
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  // The Monday on or before a date (yyyy-mm-dd); empty for no date.
  function monday(value) {
    if (!weekday(value)) return '';
    const d = new Date(value + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7);
    return d.toISOString().slice(0, 10);
  }
  function fire(el, types) { (types || ['input', 'change']).forEach(type => el.dispatchEvent(new Event(type, {bubbles: true}))); }
  function speaker(after) {
    const live = document.createElement('span');
    live.className = 'kms-sr'; live.setAttribute('role', 'status'); live.setAttribute('aria-live', 'polite');
    after.after(live);
    return live;
  }
  // The label that names a field, moved to the control that now stands in for it.
  function labelFor(el, target) {
    const label = el.id ? document.querySelector('label[for="' + el.id + '"]') : null;
    if (label && target) label.htmlFor = target.id;
    return label;
  }
  // A <select> kept as the screen's value while another control stands in for
  // it: script that sets its value, its options or disabled is followed.
  function follow(select, refresh) {
    watchValue(select, refresh);
    new MutationObserver(refresh).observe(select, {childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['disabled']});
  }
  // Chooses a value on the screen's <select> as a person would, so its own
  // change handler runs (and may ask, or put the old value back).
  function choose(select, value) {
    if (select.value === value) return false;
    select.value = value; fire(select);
    return true;
  }

  // Searchable picker: a combobox over the options of a long <select>, which
  // stays hidden as the value the screen reads and sets. Typing filters (no
  // capitals or accents needed), recently chosen come first, Arrow keys move,
  // Enter chooses, Escape closes, and leaving the field keeps the choice that
  // was made. options: placeholder, noun ['supplier', 'suppliers'], recent()
  // (values to list first; by default those chosen on this page).
  function picker(select, options) {
    if (!select || select.dataset.kmsPicker) return null;
    options = options || {};
    select.dataset.kmsPicker = '1';
    const wrap = document.createElement('div'), input = document.createElement('input'), clear = document.createElement('button'), list = document.createElement('ul');
    const noun = options.noun || ['choice', 'choices'];
    wrap.className = 'kms-picker';
    input.id = (select.id || nextId('kmsPick')) + 'Search'; input.type = 'text'; input.autocomplete = 'off'; input.spellcheck = false;
    input.setAttribute('role', 'combobox'); input.setAttribute('aria-autocomplete', 'list'); input.setAttribute('aria-expanded', 'false');
    input.setAttribute('enterkeyhint', 'done');
    list.id = input.id + 'List'; list.className = 'kms-picker-list'; list.setAttribute('role', 'listbox'); list.hidden = true;
    input.setAttribute('aria-controls', list.id);
    clear.type = 'button'; clear.className = 'kms-picker-clear'; clear.tabIndex = -1; clear.textContent = '×'; clear.hidden = true;
    const label = labelFor(select, input);
    if (label) { label.id = label.id || input.id + 'Label'; list.setAttribute('aria-labelledby', label.id); }
    clear.setAttribute('aria-label', 'Clear search' + (label ? ': ' + label.textContent : ''));
    select.replaceWith(wrap); wrap.append(input, clear, list, select);
    select.hidden = true; select.tabIndex = -1; select.setAttribute('aria-hidden', 'true');
    const live = speaker(wrap);
    let shown = [], active = -1, chosen = [];
    const items = () => Array.from(select.options).map(o => ({value: o.value, label: o.textContent, detail: o.dataset.kmsDetail || '', disabled: o.disabled}));
    const current = () => items().find(item => item.value === select.value);
    // The field shows the chosen option; an empty choice shows as the placeholder.
    function show() {
      const item = current(), blank = items().find(i => i.value === '');
      input.placeholder = options.placeholder || (blank ? blank.label : 'Type to search');
      const text = item && item.value !== '' ? item.label : '';
      if (document.activeElement !== input || list.hidden) { if (input.value !== text) input.value = text; }
      input.disabled = select.disabled;
      if (select.disabled) close();
      clear.hidden = !input.value || input.disabled;
    }
    function render(query) {
      const q = plain((query || '').trim()), all = items(), value = select.value;
      const match = all.filter(i => i.value !== '' && (!q || plain(i.label + ' ' + i.detail).indexOf(q) >= 0));
      const recent = (options.recent ? options.recent() : chosen).filter(v => v !== '');
      // Recently chosen first, only where the list is long enough to need it.
      const first = all.length > 7 ? recent.map(v => match.find(i => i.value === v)).filter(Boolean) : [];
      const rest = match.filter(i => first.indexOf(i) < 0);
      list.replaceChildren(); shown = []; active = -1; input.removeAttribute('aria-activedescendant');
      const head = text => { const li = document.createElement('li'); li.className = 'kms-picker-group'; li.setAttribute('role', 'presentation'); li.setAttribute('aria-hidden', 'true'); li.textContent = text; list.append(li); };
      const row = item => {
        const li = document.createElement('li'), name = document.createElement('span');
        li.id = list.id + shown.length; li.setAttribute('role', 'option'); li.setAttribute('aria-selected', 'false');
        if (item.disabled) li.setAttribute('aria-disabled', 'true');
        if (item.value === value) li.classList.add('kms-current');
        const at = q ? plain(item.label).indexOf(q) : -1;
        if (at >= 0) { const m = document.createElement('mark'); m.textContent = item.label.slice(at, at + q.length); name.append(item.label.slice(0, at), m, item.label.slice(at + q.length)); }
        else name.textContent = item.label;
        li.append(name);
        if (item.detail) { const small = document.createElement('small'); small.textContent = item.detail; li.append(small); }
        // Pressing an option must not take the focus from the field first.
        li.addEventListener('pointerdown', event => event.preventDefault());
        li.addEventListener('mousedown', event => event.preventDefault());
        li.addEventListener('click', () => pick(item));
        list.append(li); shown.push({li, item});
      };
      const blank = all.find(i => i.value === '');
      if (blank && !q) row(blank);
      if (first.length) { head('Recently used'); first.forEach(row); if (rest.length) head('All ' + noun[1]); }
      rest.forEach(row);
      if (!match.length && q) { const none = document.createElement('li'); none.className = 'kms-picker-empty'; none.setAttribute('role', 'presentation'); none.textContent = 'No ' + noun[0] + ' matches “' + query.trim() + '”.'; list.append(none); }
      list.hidden = false; input.setAttribute('aria-expanded', 'true');
      live.textContent = !q ? '' : match.length ? match.length + ' ' + (match.length === 1 ? noun[0] : noun[1]) + ' found.' : 'No ' + noun[0] + ' matches.';
      if (q && shown.length) move(0);
      else { const at = shown.findIndex(s => s.item.value === value && value !== ''); if (at >= 0) move(at, true); }
    }
    function move(i, quiet) {
      if (!shown.length) return;
      if (active >= 0 && shown[active]) shown[active].li.setAttribute('aria-selected', 'false');
      active = (i + shown.length) % shown.length;
      const li = shown[active].li;
      li.setAttribute('aria-selected', 'true'); input.setAttribute('aria-activedescendant', li.id);
      if (!quiet && li.scrollIntoView) li.scrollIntoView({block: 'nearest'});
    }
    function close() {
      list.hidden = true; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); active = -1;
    }
    function pick(item) {
      if (!item || item.disabled) return;
      close();
      if (item.value !== '') chosen = [item.value].concat(chosen.filter(v => v !== item.value)).slice(0, 3);
      choose(select, item.value);
      show();
    }
    input.addEventListener('focus', () => { if (!input.disabled) { try { input.select(); } catch (error) {} } });
    input.addEventListener('click', () => { if (list.hidden && !input.disabled) render(''); });
    input.addEventListener('input', () => { render(input.value); clear.hidden = !input.value; });
    input.addEventListener('keydown', event => {
      if (input.disabled) return;
      if (event.key === 'ArrowDown') { event.preventDefault(); if (list.hidden) { render(''); if (!event.altKey && active < 0) move(0); } else move(active + 1); }
      else if (event.key === 'ArrowUp') { event.preventDefault(); if (list.hidden) { render(''); move(shown.length - 1); } else move(active - 1); }
      else if (event.key === 'Enter') { if (!list.hidden && active >= 0) { event.preventDefault(); pick(shown[active].item); } }
      else if (event.key === 'Escape') { if (!list.hidden) { event.preventDefault(); event.stopPropagation(); close(); show(); } }
      else if (event.key === 'Tab') { close(); }
    });
    // Leaving the field closes the list and shows the choice as it is; typing alone never chooses.
    wrap.addEventListener('focusout', event => { if (!wrap.contains(event.relatedTarget)) { close(); show(); } });
    clear.addEventListener('click', () => { input.value = ''; clear.hidden = true; input.focus(); render(''); });
    follow(select, show);
    return {input, list, refresh: show, open: () => render(input.value), close};
  }

  // Shortcut buttons under a date (Today, Yesterday) or a From/To pair (Last 7
  // days, This month). target: a date field, or [from, to]. Each shortcut:
  // {label, days} with days a number (one date) or [fromDays, toDays], or
  // {label, month: true} for the first of this month to today, or {label,
  // value()} giving the dates. A shortcut sets the date as a person would; the
  // one that matches shows as pressed. after: the element the row goes under
  // (by default the last field).
  function dateShortcuts(target, shortcuts, after) {
    const fields = Array.isArray(target) ? target : [target];
    if (!fields[0] || fields[0].dataset.kmsShortcuts) return null;
    fields[0].dataset.kmsShortcuts = '1';
    const row = document.createElement('div'), label = labelFor(fields[0]);
    row.className = 'kms-chips'; row.setAttribute('role', 'group');
    row.setAttribute('aria-label', 'Date shortcuts' + (label ? ': ' + label.textContent : ''));
    const values = shortcut => {
      if (shortcut.value) return shortcut.value();
      if (shortcut.month) return [isoDay(0).slice(0, 8) + '01', isoDay(0)];
      const days = Array.isArray(shortcut.days) ? shortcut.days : [shortcut.days];
      return days.map(n => isoDay(n));
    };
    const buttons = shortcuts.map(shortcut => {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'kms-chip'; button.textContent = shortcut.label; button.setAttribute('aria-pressed', 'false');
      button.addEventListener('click', () => {
        if (fields.some(f => f.disabled)) return;
        // From first, then To, so the screen's own range rules see them in order.
        values(shortcut).forEach((value, i) => { if (fields[i] && fields[i].value !== value) { fields[i].value = value; fire(fields[i]); } });
        refresh();
      });
      row.append(button);
      return {button, shortcut};
    });
    function refresh() {
      const now = fields.map(f => f.value).join('|'), off = fields.some(f => f.disabled);
      buttons.forEach(({button, shortcut}) => { button.setAttribute('aria-pressed', String(values(shortcut).join('|') === now)); button.disabled = off; });
    }
    const last = fields[fields.length - 1], place = () => { const host = after || last.closest('.kms-date') || last; host.after(row); };
    place();
    fields.forEach(f => {
      watchValue(f, refresh);
      new MutationObserver(refresh).observe(f, {attributes: true, attributeFilter: ['disabled']});
    });
    // The weekday wrapper is added when the page is ready; the row stays under it.
    if (!after) document.addEventListener('DOMContentLoaded', () => { if (!row.previousElementSibling || !row.previousElementSibling.contains(last)) place(); }, {once: true});
    return {row, refresh};
  }

  // A week-commencing field: any date chosen moves to the Monday of its week,
  // before the screen's own handlers see it, and This week / Next week

    const content = document.querySelector(body.dataset.kmsContent || 'main') || body;

    function fit() { if (body.dataset.kmsLayout !== 'console') content.style.paddingBottom = (footer.getBoundingClientRect().height + 22) + 'px'; }

    if (detail) new MutationObserver(refresh).observe(detail,{childList:true,subtree:true,characterData:true});
    ['input','change','click'].forEach(function(event) { document.addEventListener(event,refresh); });
    const owner=maintenanceOwner();if(owner){const unsubscribe=owner.subscribeMaintenance(render);window.addEventListener('pagehide',unsubscribe,{once:true});if(window.KmsMaintenanceInitial)owner.setMaintenance(window.KmsMaintenanceInitial);}else scheduleMaintenance();

</head><body data-kms-detail="#status">
<main class="shell"><header class="kms-header top"><div><h1>Weekly order sheet</h1><p class="kms-muted">Write quantities in packs against each delivery day. This is a paper template; printing does not update stock or invoices.</p></div></header>
<section class="kms-panel"><div class="controls"><div class="field"><label for="weekStart">Week commencing Monday</label><input id="weekStart" type="date"></div><div class="field"><label for="supplierSelect">Suppliers</label><select id="supplierSelect"><option value="">All suppliers</option></select></div><button id="printButton" class="kms-primary" type="button" disabled>Print weekly sheet</button></div><p id="status" role="status" class="kms-small kms-muted">Loading stocked items…</p><p id="missing" class="kms-msg kms-msg-check kms-msg-line" hidden></p></section>
<section class="kms-panel"><div id="preview" class="kms-table-wrap table-wrap"></div></section></main><div id="printArea"></div>
<script>
const $=id=>document.getElementById(id),days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let groups=[];
function mondayOf(date){const d=new Date(date+'T12:00:00Z');if(Number.isNaN(d.getTime()))return '';d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10);}
function labelDay(monday,offset){const d=new Date(monday+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+offset);return days[offset]+' '+String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0');}
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function chosen(){return groups.filter(g=>!$('supplierSelect').value||g.id===$('supplierSelect').value);}
function makeTable(monday){const table=node('table'),head=node('thead'),row=node('tr');['Ingredient','Supplier ref','Pack'].concat(days.map((_,i)=>labelDay(monday,i))).forEach((title,i)=>row.append(node('th',title,i>=3?'day':'')));head.append(row);table.append(head);const body=node('tbody');chosen().forEach(group=>{const heading=node('tr',undefined,'group'),cell=node('td',group.name+' · '+group.items.length+' items');cell.colSpan=10;heading.append(cell);body.append(heading);group.items.forEach(item=>{const tr=node('tr');tr.append(node('td',item.name,'item-name'),node('td',item.reference||'','ref'),node('td',item.packQuantity+' '+item.unit,'pack'));days.forEach(()=>tr.append(node('td','', 'order-cell day')));body.append(tr);});});table.append(body);return table;}
function render(){const monday=mondayOf($('weekStart').value),selected=chosen(),count=selected.reduce((sum,g)=>sum+g.items.length,0);$('preview').replaceChildren();$('printButton').disabled=!monday||!count;if(!monday){$('status').textContent='Choose a valid week commencing date.';return;}$('status').textContent=selected.length+' supplier(s), '+count+' stocked items · '+monday+' to '+labelDay(monday,6)+'.';if(count)$('preview').append(makeTable(monday));else $('preview').textContent='No stocked items for this supplier.';}
function printSheet(){const monday=mondayOf($('weekStart').value);if(!monday||!chosen().length)return;const area=$('printArea');area.replaceChildren(node('h1','KMS · Weekly order sheet'),node('p','Week commencing '+monday+' · '+($('supplierSelect').value?chosen()[0].name:'All suppliers')+' · Quantities in packs','print-meta'),makeTable(monday));if(!$('missing').hidden)area.append(node('p',$('missing').textContent,'print-warning'));window.print();}
const now=new Date();$('weekStart').value=mondayOf(new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10));$('weekStart').addEventListener('change',()=>{$('weekStart').value=mondayOf($('weekStart').value);render();});$('supplierSelect').addEventListener('change',render);$('printButton').addEventListener('click',printSheet);
KmsUi.weekField($('weekStart'));KmsUi.picker($('supplierSelect'),{noun:['supplier','suppliers']});
KmsStatus.run().withSuccessHandler(data=>{groups=data.groups;groups.forEach(g=>$('supplierSelect').add(new Option(g.name,g.id)));if(data.missing.length){$('missing').hidden=false;$('missing').textContent='Active items without an Active supplier are omitted: '+data.missing.join(', ')+'. Assign their supplier in Manage Ingredients.';}render();}).withFailureHandler(error=>{$('status').textContent=error.message||String(error);}).kmsWeeklyOrderSheetData();
</script></body></html>
