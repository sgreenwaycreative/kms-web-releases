<!DOCTYPE html>
<html>
<head>

    @media(max-width:1050px){.topbar{gap:14px;padding:12px 16px}.brand{min-width:180px}.overview.has-photo{grid-template-columns:minmax(190px,27%) minmax(0,1fr)}.work-grid{grid-template-columns:minmax(260px,.9fr) minmax(0,1.1fr)}.main{padding:15px 16px 20px}}

  </style>

<body data-kms-footer=".footnote" data-kms-layout="console" data-kms-content=".main">
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brandmark">KMS</div><div class="brandcopy"><small>Kitchen Management System</small><strong>Recipe Console</strong></div></div>
    <div class="controls">
      <div class="type-switch" role="group" aria-label="Choose record type">
        <button id="dishButton" type="button" aria-pressed="true">Dish</button>
        <button id="prepButton" type="button" aria-pressed="false">Prep</button>
      </div>
      <label class="select-wrap" for="recordSelect">Active record
        <select id="recordSelect" disabled><option>Loading…</option></select>
      </label>
    </div>
  </header>
  <div id="notice" class="notice" role="status" hidden></div>
  <main class="main">
    <div id="loading" class="loading"><div class="spinner"></div><div>Loading current recipes…</div></div>
    <div id="empty" class="empty" hidden></div>
    <article id="recipe" class="recipe" hidden>
      <header class="recipe-head"><div><p id="eyebrow" class="eyebrow">Dish</p><h1 id="recipeName"></h1></div><span class="active-badge">Active</span></header>
      <section id="overview" class="overview">
        <figure id="photoCard" class="photo-card" hidden><img id="photo" alt=""></figure>
        <div class="overview-info">
          <div id="details" class="detail-grid"></div>
          <div id="costPanel" class="cost-panel"></div>
          <div id="allergens" class="allergens"></div>
        </div>
      </section>
      <div class="work-grid">
        <section class="card"><header class="card-head"><h2 id="componentTitle">Components</h2><span id="componentCount" class="count"></span></header><div id="components" class="component-list"></div></section>
        <section class="card"><header class="card-head"><h2 id="methodTitle">Method</h2><span id="methodCount" class="count"></span></header><div id="methods" class="method-list"></div></section>
      </div>
    </article>
  </main>
  <footer class="footnote">Read-only view · details and costs follow the current Active revision.</footer>
</div>
<script>
  const $ = function(id){return document.getElementById(id);};
  let currentType = 'Dish';
  let requestNumber = 0;
  let currentRecords = [];

  function resizeDialog(){
    try{
      const w = Math.max(700, Math.min(1600, (window.screen.availWidth || 1440) - 40));
      const h = Math.max(540, Math.min(1000, (window.screen.availHeight || 960) - 80));
      google.script.host.setWidth(w);
      google.script.host.setHeight(h);
    }catch(e){}
  }
  function setTypeButtons(type){
    $('dishButton').setAttribute('aria-pressed',type === 'Dish' ? 'true' : 'false');
    $('prepButton').setAttribute('aria-pressed',type === 'Prep' ? 'true' : 'false');
  }
  function showNotice(message,kind){
    const node = $('notice');
    node.textContent = message || '';
    node.className = 'notice' + (kind === 'error' ? ' error' : '');
    node.hidden = !message;
  }
  function beginLoading(message){
    $('recipe').hidden = true;
    $('empty').hidden = true;
    $('loading').hidden = false;
    $('loading').lastElementChild.textContent = message || 'Loading…';
  }
  function showEmpty(message){
    $('loading').hidden = true;
    $('recipe').hidden = true;
    $('empty').hidden = false;
    $('empty').textContent = message;
  }
  function loadType(type,initial){
    const token = ++requestNumber;
    currentType = type || 'Dish';
    setTypeButtons(currentType);
    beginLoading('Loading current ' + (currentType === 'Prep' ? 'Prep recipes' : 'Dishes') + '…');
    showNotice('');
    let runner = KmsStatus.run().withSuccessHandler(function(result){
      if(token !== requestNumber) return;
      currentType = result.type || currentType;
      currentRecords = result.records || [];
      setTypeButtons(currentType);
      fillRecordSelect(currentRecords);
      if(result.ambiguous && result.ambiguous.length){
        showNotice('Some records are hidden because more than one revision is marked Active. Review their status in the workbook.');
      }
      if(result.allergenTestData){
        showNotice('TEST DATA — NOT FOR SERVICE — allergen values are placeholders for testing.');
      }
      if(result.record){
        if($('recordSelect').options.length) $('recordSelect').value = result.record.id;
        renderRecord(result.record,result.allergenTestData);
        if(result.record.photoFileId)loadPhoto(currentType,result.record.id,token,result.record.name);
      }else{
        showEmpty('There are no uniquely Active ' + (currentType === 'Prep' ? 'Prep recipes' : 'Dishes') + ' to display.');
      }

      if(token !== requestNumber) return;
      $('loading').hidden = true;
      showEmpty('The Console could not load this workbook data.');
      showNotice(error && error.message ? error.message : String(error), 'error');
    });

  function fillRecordSelect(records){

      const option = document.createElement('option');
      option.value = record.id;
      option.textContent = record.label || record.name;
      select.appendChild(option);
    });
    select.disabled = !records.length;
  }
  function loadRecord(id){
    if(!id) return;
    const token = ++requestNumber;
    beginLoading('Loading ' + (currentType === 'Prep' ? 'Prep recipe' : 'Dish') + '…');

      if(token !== requestNumber) return;
      renderRecord(record,true);
      if(record.photoFileId)loadPhoto(currentType,id,token,record.name);
    }).withFailureHandler(function(error){
      if(token !== requestNumber) return;
      $('loading').hidden = true;
      showEmpty('This Active record could not be loaded.');
      showNotice(error && error.message ? error.message : String(error),'error');
    }).kmsGetRecipeConsoleRecord(currentType,id);
  }
  function loadPhoto(type,id,token,title){
    // The recipe is usable while its optional photo is fetched separately.
    KmsStatus.run({background:true}).withSuccessHandler(function(photoData){
      if(token !== requestNumber) return;
      const overview=$('overview'), card=$('photoCard'), img=$('photo');

        img.alt=(type === 'Prep' ? 'Recipe photo for ' : 'Plating photo for ')+(title || 'selected record');
        card.hidden=false;
        overview.classList.add('has-photo');
      }else{
        img.removeAttribute('src');img.alt='';card.hidden=true;overview.classList.remove('has-photo');

      if(token !== requestNumber) return;
      $('photo').removeAttribute('src');$('photoCard').hidden=true;$('overview').classList.remove('has-photo');

  function addDetail(label,value){

    const card = document.createElement('div');
    card.className = 'detail';
    const title = document.createElement('span');
    title.className = 'detail-label';
    title.textContent = label;
    const text = document.createElement('div');
    text.className = 'detail-value';
    text.textContent = String(value);
    card.append(title,text);
    $('details').appendChild(card);
  }
  function formatMoney(value,currency){
    if(value === '' || value === null || value === undefined || !isFinite(Number(value))) return '—';
    const formatted = new Intl.NumberFormat('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(value));
    const symbol = String(currency || '').trim();
    if(!symbol) return formatted;
    return /^[A-Za-z]{3}$/.test(symbol) ? symbol + ' ' + formatted : symbol + formatted;
  }
  function addCost(label,value,kind,currency){
    const card = document.createElement('div');
    card.className = 'cost-card';
    const title = document.createElement('span');
    title.className = 'cost-label';
    title.textContent = label;
    const result = document.createElement('div');
    result.className = 'cost-value';
    if(kind === 'gp'){
      result.textContent = value === '' || value === null || value === undefined || !isFinite(Number(value)) ? '—' : (Number(value) * 100).toFixed(1) + '%';
      if(Number(value) < 0) result.classList.add('negative');
    }else result.textContent = formatMoney(value,currency);
    card.append(title,result);
    $('costPanel').appendChild(card);
  }
  function renderAllergens(profile){
    const box = $('allergens');
    box.replaceChildren();
    const title = document.createElement('div');
    title.className = 'allergen-title';
    title.textContent = 'Allergen summary';
    box.appendChild(title);
    const items = profile && profile.items ? profile.items : [];
    const contains = items.filter(function(item){return item.contains;});
    const risks = items.filter(function(item){return item.risk;});
    if(contains.length) addAllergenRow(box,'Contains',contains,false);
    if(risks.length) addAllergenRow(box,'Cross-contact risk',risks,true);
    if(!contains.length && !risks.length){
      const state = document.createElement('div');
      state.className = 'allergen-state' + (profile && profile.unknown ? ' review' : '');
      state.textContent = profile && profile.unknown ? 'Allergen information needs review.' : 'No allergens recorded.';
      box.appendChild(state);
    }else if(profile && profile.unknown){
      const state = document.createElement('div');
      state.className = 'allergen-state review';
      state.textContent = 'Some component allergen information needs review.';
      box.appendChild(state);
    }
  }
  function addAllergenRow(box,label,items,risk){
    const row = document.createElement('div');
    row.className = 'allergen-row';
    const name = document.createElement('div');
    name.className = 'allergen-label';
    name.textContent = label;
    const chips = document.createElement('div');
    chips.className = 'chips';
    items.forEach(function(item){
      const chip = document.createElement('span');
      chip.className = 'chip' + (risk ? ' risk' : '');
      chip.textContent = item.name;
      chips.appendChild(chip);
    });
    row.append(name,chips);
    box.appendChild(row);
  }
  function renderComponents(record,isPrep){
    const list = $('components');
    list.replaceChildren();
    const rows = isPrep ? (record.ingredients || []) : (record.components || []);
    $('componentTitle').textContent = isPrep ? 'Ingredients & prep components' : 'Dish components';
    $('componentCount').textContent = rows.length + (rows.length === 1 ? ' line' : ' lines');
    if(!rows.length){

    }

    ['Component','Quantity','Line total'].forEach(function(label){const heading=document.createElement('div');heading.textContent=label;columns.appendChild(heading);});
    list.appendChild(columns);
    rows.forEach(function(item){
      const row = document.createElement('div');row.className='component-row';
      const main = document.createElement('div');main.className='component-main';
      const name = document.createElement('div');name.className='component-name';name.textContent=item.component || 'Unnamed component';
      const type = document.createElement('span');type.className='component-type';type.textContent=item.type === 'Prep' ? 'Prep' : 'Ingredient';name.appendChild(type);
      main.appendChild(name);
      if(item.notes){const note=document.createElement('div');note.className='component-note';note.textContent=item.notes;main.appendChild(note);}
      const amount=document.createElement('div');amount.className='component-amount';
      const quantity=item.quantity === '' || item.quantity === null || item.quantity === undefined ? '—' : item.quantity;
      amount.textContent=String(quantity);
      const unit=document.createElement('small');unit.textContent=item.unit || '';amount.appendChild(unit);
      const cost=document.createElement('div');cost.className='component-cost';cost.textContent=formatMoney(item.lineCost,record.currency);row.append(main,amount,cost);list.appendChild(row);
    });
  }
  function renderMethods(record,isPrep){
    const list = $('methods');list.replaceChildren();
    const rows=record.methods || [];
    $('methodTitle').textContent=isPrep ? 'Method' : 'Assembly';
    $('methodCount').textContent=rows.length + (rows.length === 1 ? ' step' : ' steps');
    if(!rows.length){const empty=document.createElement('div');empty.className='section-empty';empty.textContent='No method steps recorded.';list.appendChild(empty);return;}
    rows.forEach(function(item,index){
      const row=document.createElement('div');row.className='method-row';
      const number=document.createElement('div');number.className='step-number';number.textContent=String(item.stepNo || index+1);
      const body=document.createElement('div');
      const instruction=document.createElement('div');instruction.className='step-instruction';instruction.textContent=item.instruction || '';
      body.appendChild(instruction);
      const cues=[];
      if(item.time) cues.push(item.time);
      if(item.notes) cues.push(item.notes);
      if(cues.length){const cue=document.createElement('div');cue.className='step-cue';cue.textContent=cues.join(' · ');body.appendChild(cue);}
      row.append(number,body);list.appendChild(row);
    });
  }
  function renderRecord(record,allergenTestData){
    $('loading').hidden=true;$('empty').hidden=true;$('recipe').hidden=false;
    const isPrep=record.recordType==='Prep';
    const title=record.name || (isPrep ? 'Prep recipe' : 'Dish');
    $('recipeName').textContent=title;
    $('eyebrow').textContent=isPrep ? 'Prep recipe' : 'Dish specification';
    $('details').replaceChildren();$('costPanel').replaceChildren();
    const overview=$('overview');overview.classList.remove('has-photo');
    const photoCard=$('photoCard');const photo=$('photo');
    if(record.photo && record.photo.available && record.photo.dataUrl){
      photo.src=record.photo.dataUrl;photo.alt=(isPrep ? 'Recipe photo for ' : 'Plating photo for ')+title;
      photoCard.hidden=false;overview.classList.add('has-photo');
    }else{photo.removeAttribute('src');photo.alt='';photoCard.hidden=true;}
    if(isPrep){
      const yieldText=[record.yieldValue,record.unit].filter(function(v){return v!=='' && v!==null && v!==undefined;}).join(' ');
      addDetail('Usable yield',yieldText);
      addDetail('Quality standard',record.quality);
      addDetail('Handling notes',record.handling);
      const cost=record.costing || {};
      addCost('Batch cost',cost.batchCost,'money',record.currency);
      addCost('Cost per yield unit',cost.unitCost,'money',record.currency);
    }else{
      addDetail('Serving',record.serving);
      addDetail('Plate / container',record.plate);
      addDetail('Presentation standard',record.presentation);
      addDetail('Notes',record.notes);
      const cost=record.costing || {};
      addCost('Food cost per portion',cost.found ? cost.foodCost : record.foodCost,'money',record.currency);
      addCost('Selling price incl. tax',cost.found ? cost.sellingPrice : '', 'money',record.currency);
      addCost('Actual GP',cost.found ? cost.actualGp : '', 'gp',record.currency);
    }
    renderAllergens(record.allergenProfile);
    renderComponents(record,isPrep);
    renderMethods(record,isPrep);
    if(allergenTestData){showNotice('TEST DATA — NOT FOR SERVICE — allergen values are placeholders for testing.');}
  }
  $('dishButton').addEventListener('click',function(){if(currentType!=='Dish')loadType('Dish',false);});
  $('prepButton').addEventListener('click',function(){if(currentType!=='Prep')loadType('Prep',false);});
  $('recordSelect').addEventListener('change',function(){loadRecord(this.value);});
  window.addEventListener('resize',resizeDialog);
  window.addEventListener('load',function(){resizeDialog();loadType('Dish',true);});
</script>
</body>
</html>
